
[project]
name = "call-me-maybe"
version = "0.1.0"
description = "A lightweight local LLM wrapper"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.24.0",
    "accelerate",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
